services:
  postgres:
    image: postgres:17-alpine
    container_name: steik-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: steik_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - steik_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d steik_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  steik_postgres_data:
